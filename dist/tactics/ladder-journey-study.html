<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Ladder approach and landing · Animal Factory</title>
<style>body{margin:0;background:#202b26;color:#f5ead1;font:15px system-ui}header{padding:18px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font:600 23px Georgia;margin:0}label{display:flex;align-items:center;gap:7px}select,button{background:#35483a;color:inherit;border:1px solid #849578;padding:7px;border-radius:4px}button{cursor:pointer}#scene{display:block;width:100%;height:auto;max-height:82vh;object-fit:contain}footer{padding:12px 24px}#progress{width:min(700px,65vw)}#status{margin:8px 0;color:#d4dbb8}.note{font-size:13px;color:#aebfae}</style>
<header><h1>Approach and landing</h1><label>Animal <select id="animal"></select></label><label>Outfit <select id="outfit"><option value="normal">Original</option><option value="red-hats">Red Hat</option></select></label><label>Ladder <select id="ladder"><option value="tower">Tower · 22 rungs</option></select></label><label>View <select id="view"><option value="three">Three-quarter</option><option value="side">Side</option><option value="front">Front</option><option value="rear">Rear</option></select></label><label>Scale <select id="scale"><option value="full">Full ladder</option><option value="close">Close</option><option value="game">Gameplay · 58 px/unit</option></select></label><label><select id="direction"><option value="up">Climb up</option><option value="down">Climb down</option></select></label><label>Post <select id="slot"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><label>Rotation <select id="rotation"><option value="0">Normal</option><option value="1">Quarter turn</option></select></label><label><input id="cutaway" type="checkbox">Cutaway</label><button id="play">Play</button></header>
<canvas id="scene"></canvas><footer><input id="progress" type="range" min="0" max="1" step=".001" value="0"><span id="time"></span><p id="status">Loading painted character…</p><p class="note">Approach and landing on the actual iron tower. The climb itself remains six seconds; walking and weapon handoffs add time. Wooden hatches, pig exits and hen climbing remain separate tasks.</p></footer><script type="module" src="./ladder-journey-study.js"></script></html>
