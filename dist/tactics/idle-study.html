<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle · Animal Factory</title><link rel="icon" href="data:,"><link rel="stylesheet" href="idle-study.css"></head>
<body><header><div><h1>Idle · standing and looking around</h1><p>Seeded loop · looks, breathing and weight shifts · both feet planted · the eleven mammal workers</p></div>
<nav aria-label="Study controls"><button id="play" disabled>Pause</button><button id="restart" disabled>Restart</button><label>Character <select id="species"></select></label><label>Loop <select id="seed"><option value="1">Seed 1</option><option value="2">Seed 2</option><option value="3">Seed 3</option><option value="4">Seed 4</option><option value="5">Seed 5</option><option value="6">Seed 6</option><option value="7">Seed 7</option><option value="8">Seed 8</option></select></label><label>View <select id="view"><option value="three">Three-quarter</option><option value="side">Side</option><option value="front">Front</option><option value="rear">Rear</option></select></label><label>Scale <select id="scale"><option value="close">Character close-up</option><option value="wide">Surroundings</option><option value="game">Gameplay</option></select></label><label><input id="gaze" type="checkbox"> Gaze line</label><label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option><option value="2">2×</option></select></label></nav></header>
<main id="stage" aria-label="Interactive 3D idle study"><div id="loading" role="status">Loading the painted worker…</div><div id="error" role="alert"></div></main>
<footer><div class="timeline"><label for="time">Loop</label><input id="time" type="range" min="0" max="30" step="0.01" value="0" disabled><output id="status" for="time">Loading</output></div><div id="keyframes" aria-label="Jump to a look"></div><p>Drag to orbit. Native character and tile dimensions. Each seed is its own seamless loop; the time wraps.</p></footer><script type="module" src="idle-study.js"></script></body></html>
