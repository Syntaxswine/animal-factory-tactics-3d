<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broken wall edges · Animal Factory</title><link rel="icon" href="data:,"><link rel="stylesheet" href="painted-fire-study.css"></head><body>
<header><div><h1>Broken wall edges</h1><p>Chipped masonry · torn metal · connected openings</p></div><a href="battle-3d.html?study=wall-breaches">Try the demolition range ↗</a></header>
<main><section class="controls" aria-label="Wall breach controls">
<label>Material <select id="material"><option value="brick">Brick</option><option value="concrete">Concrete</option><option value="corrugated">Corrugated metal</option></select></label>
<label>Opening <select id="count"><option value="0">Intact</option><option value="1" selected>1 segment</option><option value="2">2 segments</option><option value="3">3 segments</option><option value="4">4 segments</option><option value="5">5 segments</option></select></label>
<button id="widen">Widen opening</button><button id="restore">Restore wall</button>
<label>Layout <select id="layout"><option value="straight">Straight wall</option><option value="corner">Around a corner</option><option value="separated">Separated gaps</option><option value="window">Beside a window</option></select></label>
<label>Direction <select id="axis"><option value="s">Across</option><option value="e">Along</option></select></label>
<label>Floor <select id="level"><option value="0">Ground</option><option value="1">Upper</option></select></label>
<label>View <select id="view"><option value="three">Three-quarter</option><option value="front">Front</option><option value="rear">Rear</option><option value="top">Top</option></select></label>
<label>Scale <select id="scale"><option value="close">Close</option><option value="game">Gameplay</option></select></label><label><input id="grid" type="checkbox" checked>Tile grid</label></section>
<div id="viewport"><div id="loading">Loading wall study…</div></div><p id="status" role="status"></p><p id="error" role="alert"></p>
<footer>One square is one tile. The horse uses its normal size. Drag to orbit. Broken edges stay on surviving walls; neighboring destroyed sections become one clear passage.</footer></main>
<script type="module" src="wall-breach-study.js"></script></body></html>
