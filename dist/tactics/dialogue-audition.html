<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialogue voice auditions</title><link rel="stylesheet" href="battle-dialogue.css"><style>body{background:#172b23;color:#eee5ca;font:18px/1.5 system-ui;max-width:1000px;margin:30px auto;padding:20px}a{color:#f7d18c}button,select{font:inherit;padding:9px}nav{display:flex;gap:10px;flex-wrap:wrap}#stage{margin:22px 0;display:grid;grid-template-columns:260px 1fr;gap:25px}.dialogue-face{position:relative;top:0;width:260px;height:312px}#line{color:#162c23;background:#eee5ca;border:1px solid #afbc9d;padding:16px;border-radius:6px}#metrics{font:13px monospace;white-space:pre-wrap}textarea{width:100%;height:90px}#state{min-height:1.5em}@media(max-width:650px){#stage{grid-template-columns:1fr}}</style>
<h1>Dialogue voice auditions</h1><p>Listen to the same sentence, then each character’s own line. These are first takes for listening review. The existing intro recording is unchanged.</p>
<nav><button data-voice="guide">Plateau guide</button><button data-voice="nadia">Nadia</button><button data-voice="hen">Bright hen reference</button></nav>
<p><label><input id="blind" type="checkbox"> Compare voices without names or portraits</label></p>
<div id="stage"><div id="face" class="dialogue-face"></div><div><h2 id="name">Choose a voice</h2><p id="line" class="dialogue-speech"></p><nav><button id="neutral">Same sentence</button><button id="actual">Character’s line</button><button id="skip">Show full line</button><button id="replay">Replay</button><button id="resume">Continue</button><button id="release">Close performance</button></nav><p id="state" role="status"></p></div></div>
<div id="preferences"></div><details><summary>Review measurements</summary><pre id="metrics"></pre></details>
<p><label>Listening notes: which voice sounds warm, cautious, or bright? Which are hard to distinguish?<textarea id="notes"></textarea></label><button id="download">Save listening notes</button></p>
<p><a href="battle-3d.html?study=tutorial-intro">Try the plateau guide in play</a> · <a href="battle-3d.html?study=dialogue">Try Nadia and checked replies</a></p>
<script type="module" src="dialogue-audition.js"></script></html>
