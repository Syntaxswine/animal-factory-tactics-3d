<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro sprite keyframes</title>
<link rel="icon" href="data:,">
<style>
 :root{--bg:#1d2620;--ink:#e9e2cc;--muted:#a9ad98;--line:#3a4a3e;--accent:#d8b46a}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,serif}
 header{padding:18px 24px 6px}
 h1{margin:0;font-size:22px;font-weight:normal}
 nav{display:flex;flex-wrap:wrap;gap:8px;padding:8px 24px}
 nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:3px}
 nav a[aria-current]{border-color:var(--accent);color:var(--accent)}
 figure{margin:8px 24px 24px}
 canvas{display:block;width:100%;max-width:1600px;height:auto;border:1px solid var(--line)}
 figcaption{color:var(--muted);max-width:1600px;margin-top:8px}
 #status{color:var(--muted);padding:0 24px}
</style>
</head>
<body>
<header><h1>Intro sprite proof — descent and crash keyframes</h1></header>
<nav id="nav"></nav>
<p id="status">Painting…</p>
<figure><canvas id="keyframe" width="1600" height="900"></canvas><figcaption id="caption"></figcaption></figure>
<script type="module">
// The stills are frames of the animated proof (proof.html) at fixed times, so
// what the user approves is exactly what plays.
import {KEYFRAMES,KEYFRAME_TIMES,loadProofAssets,createProof} from './proof.js';
const q=new URLSearchParams(location.search),id=(q.get('shot')||'A').toUpperCase(),$=x=>document.getElementById(x);
$('nav').innerHTML=Object.entries(KEYFRAMES).map(([k,s])=>`<a href="?shot=${k}"${k===id?' aria-current="page"':''}>${k} · ${s.title}</a>`).join('')+'<a href="proof.html">Play the proof</a>';
try{
 if(!KEYFRAMES[id])throw Error('Unknown shot '+id);
 const t0=performance.now(),assets=await loadProofAssets(),proof=createProof($('keyframe'),assets),t=KEYFRAME_TIMES[id];
 proof.render(t);
 $('caption').textContent=KEYFRAMES[id].caption;
 $('status').textContent=`${id} · ${KEYFRAMES[id].title} · t = ${t} s · plate: ${assets.plateSource} · ${Math.round(performance.now()-t0)} ms`;
 window.keyframe={id,t,canvas:$('keyframe'),ready:true};
}catch(e){$('status').textContent='Failed: '+e.message;window.keyframe={error:e.message};throw e;}
</script>
</body>
</html>
