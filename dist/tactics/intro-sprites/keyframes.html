<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro sprite keyframes</title>
<link rel="icon" href="data:,">
<style>
 :root{--bg:#1d2620;--ink:#e9e2cc;--muted:#a9ad98;--line:#3a4a3e;--accent:#d8b46a}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,serif}
 header{padding:18px 24px 6px}
 h1{margin:0;font-size:22px;font-weight:normal}
 nav{display:flex;gap:8px;padding:8px 24px}
 nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:3px}
 nav a[aria-current]{border-color:var(--accent);color:var(--accent)}
 figure{margin:8px 24px 24px}
 canvas{display:block;width:100%;max-width:1600px;height:auto;border:1px solid var(--line)}
 figcaption{color:var(--muted);max-width:1600px;margin-top:8px}
 #status{color:var(--muted);padding:0 24px}
</style>
</head>
<body>
<header><h1>Intro sprite proof — descent and crash keyframes</h1></header>
<nav id="nav"></nav>
<p id="status">Painting…</p>
<figure><div id="stage"></div><figcaption id="caption"></figcaption></figure>
<script type="module">
import {SHOTS,loadAssets,renderShot} from './keyframes.js';
const q=new URLSearchParams(location.search),id=(q.get('shot')||'A').toUpperCase();
document.getElementById('nav').innerHTML=Object.entries(SHOTS).map(([k,s])=>`<a href="?shot=${k}"${k===id?' aria-current="page"':''}>${k} · ${s.title}</a>`).join('');
try{
 const t0=performance.now(),assets=await loadAssets(),r=renderShot(assets,id);
 r.canvas.id='keyframe';document.getElementById('stage').append(r.canvas);
 document.getElementById('caption').textContent=SHOTS[id].caption;
 document.getElementById('status').textContent=`${id} · ${SHOTS[id].title} · ${r.flora} trees/shrubs/rocks · ${Math.round(performance.now()-t0)} ms`;
 window.keyframe={id,layers:Object.fromEntries(Object.entries(r.layers).map(([k,c])=>[k,c])),canvas:r.canvas,ready:true};
}catch(e){document.getElementById('status').textContent='Failed: '+e.message;window.keyframe={error:e.message};throw e;}
</script>
</body>
</html>
